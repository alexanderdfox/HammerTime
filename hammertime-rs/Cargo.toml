[package]
name = "hammertime"
version = "0.2.0"
edition = "2021"
authors = ["Rewritten from alexanderdfox/HammerTime"]
description = "Rust rewrite of HammerTime — real-time TCP traffic defender with anomaly detection, adaptive logic mutation, and multi-timeline execution"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "=1.35.1", features = ["full"] }
clap = { version = "=4.4.18", features = ["derive", "env"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "json"] }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
toml = "=0.8.10"
ipnet = "=2.9.0"
thiserror = "=1.0.57"
anyhow = "=1.0.80"
dashmap = "=5.5.3"
parking_lot = "=0.12.1"
chrono = { version = "=0.4.34", features = ["serde"] }
ctrlc = "=3.4.2"
once_cell = "=1.19.0"

# Pin transitive deps that newer versions require edition2024
hashbrown = "=0.14.3"
indexmap = "=2.2.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
